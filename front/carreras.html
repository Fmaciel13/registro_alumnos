<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Carreras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="logo.png" alt="Logo Instituto" class="me-2 rounded-circle">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link " aria-current="page" href="./index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link " aria-current="page" href="./students.html">Estudiantes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="./carreras.html">Carreras </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="categorias.html">Categorias</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="text-center mb-4">Gestión de Carreras</h1>

    <!-- Formulario de ingreso -->
    <div class="card-dark">
      <h2 class="mb-3">Nueva Carrera</h2>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <input type="text" id="careerName" class="form-control form-control-dark" placeholder="Nombre de la carrera">
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <select id="categorySelect" class="form-select">
              <option value="">Selecciona una categoría</option>
              <!-- Las categorías se cargarán aquí dinámicamente -->
            </select>
            <button class="btn btn-primary" type="button" onclick="cargarCategoriasEnSelect()" title="Actualizar categorías">
            </button>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="registerCareer()"> Registrar </button>
      <pre id="careerRegisterResult" class="mt-2"></pre>
    </div>

    <!-- Tabla de carreras -->
    <div class="card-dark">
      <h2 class="mb-5">Listado de Carreras</h2>
      <table class="table table-dark table-striped table-dark-custom">
        <thead>
          <tr>
            <th>ID</th>
            <th>Carrera</th>
            <th>Accion</th>
          </tr>
        </thead>
        <tbody id="careerTableBody">
          <!-- Las carreras se agregarán aquí -->

        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
